name: Trigger documentation build

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "Package.swift"
      - "config.defaults.toml"
      - "config.minimal.toml"
      - "config.schema.json"
      - "Sources/EasyBarConfigSchema/**"
      - "Sources/EasyBarGenerateConfig/**"
      - "Sources/EasyBarKit/Events/**"
      - "Sources/EasyBarKit/Theme/**"
      - "Sources/EasyBarKit/Lua/**"
      - "scripts/generate/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-documentation-build
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Require Cloudflare deploy hook
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DOCS_DEPLOY_HOOK }}
        run: |
          if [[ -z "${DEPLOY_HOOK}" ]]; then
            echo "::error::Add the CLOUDFLARE_DOCS_DEPLOY_HOOK repository secret."
            exit 1
          fi

      - name: Trigger easybar.dev rebuild
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DOCS_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST "${DEPLOY_HOOK}"
