name: Trigger documentation build

on:
  push:
    branches:
      - main
    paths:
      - "config.schema.json"
      - "Sources/EasyBarConfigSchema/**"
      - "Sources/EasyBarGenerateConfig/**"
      - "Sources/EasyBarKit/Events/event_catalog.json"
      - "Sources/EasyBarKit/Theme/theme_tokens.json"
      - "Sources/EasyBarKit/Lua/easybar_api.base.lua"
      - "Sources/EasyBarKit/Lua/easybar_api.events.lua"
      - "Sources/EasyBarKit/Lua/easybar_api.themes.lua"
      - "Sources/EasyBarKit/Lua/easybar_api.lua"
      - "Sources/EasyBarKit/Lua/easybar/event_tokens.lua"
      - "Sources/EasyBarKit/Lua/easybar/theme_tokens.lua"
      - "scripts/generate/lua_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-documentation-build
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Require Cloudflare deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DOCS_DEPLOY_HOOK }}
        run: |
          if [[ -z "${DEPLOY_HOOK}" ]]; then
            echo "::error::Add the CLOUDFLARE_DOCS_DEPLOY_HOOK repository secret."
            exit 1
          fi

      - name: Trigger easybar.dev rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DOCS_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST "${DEPLOY_HOOK}"
