name: Test

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    env:
      XCODE_VERSION: "26"

    steps:
      - name: Checkout EasyBarKit
        uses: actions/checkout@v7

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install test dependencies
        shell: bash
        run: scripts/ci/install-dependencies.sh format

      - name: Run checks
        shell: bash
        run: make check
