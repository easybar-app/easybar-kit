name: Sync widget package docs

on:
  repository_dispatch:
    types:
      - widgets-packages-updated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-widget-package-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EasyBar
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout widgets
        uses: actions/checkout@v7
        with:
          repository: easybar-app/widgets
          ref: ${{ github.event.client_payload.widgets_sha || 'main' }}
          path: widget-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate package catalog
        run: make generate-widget-docs WIDGETS_ROOT=widget-source

      - name: Commit package catalog
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- docs/content/packages)" ]]; then
            echo "Widget package documentation is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content/packages
          git commit -m "docs(packages): sync widget catalog"
          git pull --rebase origin main
          git push origin HEAD:main
